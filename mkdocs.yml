site_name: Learning
site_url: https://wangsun39.github.io/Learning/

theme:
  name: material
  features:
    - content.code.copy # 代码块一键复制功能

# 启用数学公式渲染扩展
markdown_extensions:
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  # 下面这几行是用来解析 :octicons-...: 图标的
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: math # 启用 math 块的用法
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic

# 引入 MathJax 脚本（用来渲染公式）
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js